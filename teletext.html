<style>
  .tt-page{max-width:1080px;margin:0 auto;padding:28px 24px 60px;}
  .back-link{color:var(--text-dim);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;}
  .back-link:hover{color:var(--text);}
  .tt-page h1{font-size:28px;margin:0 0 6px;}
  .tt-page h1::after{content:"";display:block;width:64px;height:3px;margin-top:12px;border-radius:2px;
    background:linear-gradient(90deg,#ff3028 0 25%,#28f03c 25% 50%,#fff53c 50% 75%,#32f0ff 75%);}
  .tt-lede{color:var(--text-dim);font-size:15px;line-height:1.6;max-width:720px;margin:14px 0 22px;}

  .tt-wrap{display:flex;gap:22px;align-items:flex-start;}
  .tt-set{flex:1;min-width:0;}
  /* The TV: a dark bezel around a 4:3 picture. The canvas is 320x250 real
     pixels (40x25 cells of 8x10), scaled up without smoothing. */
  .tt-tv{position:relative;background:#050505;border-radius:22px;padding:18px;
    border:1px solid #2b2b2b;box-shadow:0 0 0 6px #1a1a1a, 0 18px 40px rgba(0,0,0,.55);}
  .tt-tv canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;
    border-radius:10px;background:#000;filter:saturate(1.08) contrast(1.04);}
  .tt-glass{position:absolute;inset:18px;border-radius:10px;pointer-events:none;
    box-shadow:inset 0 0 60px rgba(0,0,0,.65), inset 0 0 6px rgba(255,255,255,.06);
    background:radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.06), transparent 45%);}
  /* one dark half-line per source line: lines stay locked to the 250 rows */
  .tt-tv.scan .tt-glass{background:
    radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.06), transparent 45%),
    linear-gradient(rgba(0,0,0,.32) 50%, transparent 50%) 0 0 / 100% calc(100% / 250);}

  .tt-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--text-dim);}
  .tt-status{display:inline-flex;align-items:center;gap:7px;}
  .tt-status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--text-mute);}
  .tt-status.live::before{background:#28f03c;box-shadow:0 0 8px #28f03c;}
  .tt-status.stale::before,.tt-status.load::before{background:#fff53c;}
  .tt-status.off::before{background:#ff3028;}
  .tt-status.vault::before{background:var(--g7400);}
  .tt-sub{color:var(--text-mute);}
  .tt-scan{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}

  /* Remote: dark keys in the spirit of the G7400's own keyboard */
  .tt-remote{width:212px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:16px;display:flex;flex-direction:column;gap:12px;}
  .tt-remote button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #3a3f4a;
    background:linear-gradient(#2b3039,#1d2027);color:#e9edf2;box-shadow:0 2px 0 #0b0c0f;transition:transform .05s, border-color .15s;}
  .tt-remote button:hover{border-color:var(--g7400);}
  .tt-remote button:active{transform:translateY(2px);box-shadow:none;}
  .tt-remote button:disabled{opacity:.35;cursor:default;}
  .tt-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .tt-keys button{height:44px;font-size:18px;font-weight:600;}
  .tt-subkeys{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tt-subkeys button{height:34px;font-size:14px;}
  .tt-fast{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .tt-fast button{height:26px;border:none;box-shadow:0 2px 0 #0b0c0f;}
  .tt-fast .f-red{background:#e0261f;} .tt-fast .f-green{background:#1fbf35;}
  .tt-fast .f-yellow{background:#e8d81c;} .tt-fast .f-cyan{background:#1fc6d6;}
  .tt-jump{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tt-jump button{height:40px;font-size:12px;line-height:1.15;}
  .tt-jump b{display:block;font-size:15px;}

  .tt-about{max-width:760px;margin-top:38px;font-size:15px;line-height:1.7;}
  .tt-about h2{font-size:21px;margin:0 0 8px;}
  .tt-about h3{font-size:16px;margin:24px 0 6px;}
  .tt-about p{color:var(--text-dim);margin:0 0 12px;}
  .tt-about b{color:var(--text);}
  .tt-credit{font-size:13px;border-top:1px solid var(--border);padding-top:14px;margin-top:22px !important;}

  .tt-build{max-width:860px;margin-top:44px;padding-top:30px;border-top:1px solid var(--border);font-size:15px;line-height:1.7;}
  .tt-build h2{font-size:21px;margin:0 0 8px;}
  .tt-build h3{font-size:16px;margin:28px 0 8px;}
  .tt-build p,.tt-build li{color:var(--text-dim);}
  .tt-build b,.tt-build th{color:var(--text);}
  .tt-build a,.tt-about a{color:var(--accent);}
  .tt-build code{font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--text);}
  .tt-build ul,.tt-build ol{padding-left:22px;}
  .tt-build li{margin:0 0 8px;}
  .tt-build-lede{font-size:15.5px;}
  .tt-table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px;}
  .tt-table th,.tt-table td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-dim);}
  .tt-table th{font-weight:600;background:var(--surface);}
  .tt-table td:first-child{color:var(--text);white-space:nowrap;}
  .tt-pins td:nth-child(3){color:var(--text);}
  @media (max-width:640px){ .tt-table{font-size:13px;} .tt-table td:first-child{white-space:normal;} }
  @media (max-width:640px){
    .topbar{flex-wrap:wrap;row-gap:8px;}
    .topbar .social-links{display:none;}
    .tt-keys button{height:38px;}
  }
  @media (max-width:820px){
    .tt-wrap{flex-direction:column;}
    .tt-remote{width:auto;align-self:stretch;}
    .tt-tv{padding:10px;border-radius:14px;}
    .tt-glass{inset:10px;}
  }
</style>

(function () {
  function applyLang() {
    var L = window.currentLang ? window.currentLang() : "en";
    var pack = window.TT_TEXT[L] || window.TT_TEXT.en;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = window.t(el.dataset.i18n); });
    document.querySelectorAll("[data-tt]").forEach(function (el) {
      var v = pack[el.dataset.tt] || window.TT_TEXT.en[el.dataset.tt];
      if (v != null) el.innerHTML = v;
    });
    document.documentElement.lang = L;
    document.title = pack.h1 + " — Retro Vault";
    // The cartridge build plan exists in English and Dutch; other languages get English.
    var blk = L === "nl" ? "nl" : "en";
    document.querySelectorAll("[data-langblock]").forEach(function (el) { el.hidden = el.dataset.langblock !== blk; });
    if (window.VaultTeletext) window.VaultTeletext.relang();
  }
  // Same flag row as the other pages; shares the VideopacVault_lang key.
  var langFlags = document.getElementById("langFlags");
  if (langFlags && window.I18N) {
    Object.keys(window.I18N).forEach(function (code) {
      var b = document.createElement("button");
      b.className = "flag-btn"; b.dataset.lang = code;
      b.innerHTML = window.I18N[code]._flag; b.title = window.I18N[code]._name;
      b.setAttribute("aria-label", window.I18N[code]._name);
      langFlags.appendChild(b);
    });
    function markLang() {
      langFlags.querySelectorAll(".flag-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.lang === window.currentLang());
      });
    }
    markLang();
    langFlags.addEventListener("click", function (e) {
      var b = e.target.closest(".flag-btn");
      if (!b) return;
      try { localStorage.setItem(window.I18N_KEY, b.dataset.lang); } catch (err) {}
      markLang(); applyLang();
    });
  }
  window.ttApplyLang = applyLang;
  applyLang();
})();
