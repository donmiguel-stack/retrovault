<link rel="stylesheet" href="style.css?v=100">
<style>
  .resources-page{max-width:820px;margin:0 auto;padding:32px 24px 60px;}
  .back-link{color:var(--text-dim);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:6px;margin-bottom:22px;}
  .back-link:hover{color:var(--text);}
  .resources-page h1{font-size:28px;margin:0 0 4px;border-bottom:2px solid color-mix(in srgb, var(--accent) 55%, transparent);padding-bottom:14px;}
  .resources-page .modal-body{padding:0;font-size:14.5px;line-height:1.65;}
  .resources-page .modal-body h3:first-child{margin-top:18px;}
  /* The intro paragraph that leads the sources list (from setup-i18n.js'
     "sources" key) - a touch bigger and looser than the rest so it reads
     as a lede, not just another list item. */
  .resources-page .modal-body>div>p{font-size:15px;line-height:1.7;color:var(--text-dim);max-width:640px;margin:20px 0 22px;}
  /* Turn the flat <ul><li><a> list (shared with the compact Setup-modal
     version of this same content) into readable cards here specifically -
     the underlying markup stays exactly what setup-i18n.js already ships,
     only the resources.html-scoped styling changes. */
  .resources-page .modal-body ul{list-style:none;padding:0;margin:0 0 28px;display:grid;grid-template-columns:repeat(2, 1fr);gap:12px;}
  .resources-page .modal-body li{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;transition:border-color .15s, transform .15s;
  }
  .resources-page .modal-body li:hover{border-color:var(--accent);transform:translateY(-1px);}
  .resources-page .modal-body li a{color:var(--text);font-weight:600;font-size:15px;}
  .resources-page .modal-body li a:hover{color:var(--accent);}
  /* The closing "Emulators, if you'd rather..." paragraph (sourcesNote) -
     called out as its own box so it doesn't blur into the card grid above. */
  [data-s="sourcesNote"]{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin:4px 0 0;color:var(--text-dim);
  }
  @media (max-width:640px){
    .resources-page .modal-body ul{grid-template-columns:1fr;}
  }
</style>
<!-- Retro Vault — anonymous usage counting (Cloudflare Web Analytics).
     Cookieless. No personal data, no cross-site tracking, no fingerprinting.
     Does not run from an offline (file://) copy.
     Opt out permanently from the browser console:
       localStorage.setItem('rv-no-analytics', '1')
-->
<script>
(function () {
  var TOKEN = "ffd5bd26c2f548acaba24a6847413f1c";
  if (location.protocol === "file:") return;         // offline copy: beacon cannot work
  try {
    if (localStorage.getItem("rv-no-analytics") === "1") return;
  } catch (e) { /* storage blocked — carry on */ }
  var s = document.createElement("script");
  s.type = "module";
  s.src = "https://static.cloudflareinsights.com/beacon.min.js";
  s.setAttribute("data-cf-beacon", JSON.stringify({ token: TOKEN }));
  document.head.appendChild(s);
})();
</script>
</head>

<script src="i18n.js?v=110"></script>
<script src="setup-i18n.js?v=111"></script>
<script>
(function () {
  function applyLang() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = window.t(el.dataset.i18n);
    });
    var pack = (window.SETUP_I18N || {})[window.currentLang()] || (window.SETUP_I18N || {}).en;
    if (pack) {
      document.querySelectorAll("[data-s]").forEach(function (el) {
        if (pack[el.dataset.s]) el.innerHTML = pack[el.dataset.s];
      });
    }
    document.documentElement.lang = window.currentLang();
  }

  // Same flag row as index.html/game.html — five clicks' worth of choice,
  // no dropdown needed. Shares the VideopacVault_lang key so switching
  // language here also carries over back to the library.
  var langFlags = document.getElementById("langFlags");
  if (langFlags && window.I18N) {
    Object.keys(window.I18N).forEach(function (code) {
      var b = document.createElement("button");
      b.className = "flag-btn";
      b.dataset.lang = code;
      b.innerHTML = window.I18N[code]._flag;
      b.title = window.I18N[code]._name;
      b.setAttribute("aria-label", window.I18N[code]._name);
      langFlags.appendChild(b);
    });
    function markLang() {
      langFlags.querySelectorAll(".flag-btn").forEach(function (b) {
        b.classList.toggle("active", b.dataset.lang === window.currentLang());
      });
    }
    markLang();
    langFlags.addEventListener("click", function (e) {
      var b = e.target.closest(".flag-btn");
      if (!b) return;
      localStorage.setItem(window.I18N_KEY, b.dataset.lang);
      markLang();
      applyLang();
    });
  }

  applyLang();
})();
</script>
