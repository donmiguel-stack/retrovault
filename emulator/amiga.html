<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
	var params = new URLSearchParams(window.location.search);
	if (!params.get("disk")) {
		window.location.replace("../index.html");
	}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#171717">
<title>Amiga - Retro Vault</title>
<meta name="robots" content="noindex,nofollow">
<style>
	html, body { margin: 0; padding: 0; height: 100%; background: #171717; overflow: hidden; }
	#topbar {
		position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 50;
		display: flex; align-items: center; gap: 10px; padding: 0 12px;
		background: #1e1e1e; border-bottom: 1px solid #333;
		font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		box-sizing: border-box;
	}
	#topbar a {
		color: #d0d0d0; text-decoration: none; padding: 6px 10px; border-radius: 4px;
	}
	#topbar a:hover { background: #333; }
	#topbar .title { color: #888; margin-left: 4px; }
	#topbar .rom { color: #6a6a6a; margin-left: auto; font-size: 12px; }
	#amigaWrap { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }
	#amigaFrame { width: 100%; height: 100%; border: 0; display: block; }
	#loadingMsg {
		position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
		color: #999; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		text-align: center; line-height: 1.6; max-width: 80%;
	}
	#loadingMsg code { color: #c0c0c0; }
</style>
</head>
<body>
<div id="topbar">
	<a href="#" id="backLink">&larr; Back</a>
	<span class="title" id="titleText"></span>
	<span class="rom" id="romText"></span>
</div>
<div id="amigaWrap">
	<p id="loadingMsg">Loading&hellip;</p>
</div>

<script>
(function () {
	var params = new URLSearchParams(window.location.search);
	// The disk image itself: .adf (single floppy), .zip (multi-disk set, the
	// engine shows its own disk-swap list), .hdf / .lha for the hard-drive and
	// WHDLoad cases. Named "disk" rather than dos.html's "zip" because the
	// Amiga shelf is not zip-shaped the way the PC shelf is.
	var disk = params.get("disk");
	var title = params.get("title") ? decodeURIComponent(params.get("title")) : "Amiga";
	var gameId = params.get("id") || "";
	var dlfallback = params.get("dlfallback") || "";
	// The Vault's own file host (hosted.js, see game.html) - an absolute URL to
	// this same disk on retrovault.world, only ever sent after game.html's HEAD
	// check found it there. Anything that isn't absolute is ignored, so a stray
	// parameter can't point the engine at some arbitrary relative path.
	var hosted = params.get("hosted") || "";
	if (!/^(https?:)?\/\//i.test(hosted)) hosted = "";

	document.title = title + " - Retro Vault";
	document.getElementById("titleText").textContent = title;
	document.getElementById("romText").textContent = disk;
	var backHref = gameId
		? "../game.html?id=" + encodeURIComponent(gameId)
		: "../index.html";
	document.getElementById("backLink").href = backHref;

	// ---- what the engine is -------------------------------------------------
	// amiga/ is vAmigaWeb (GPL-3.0), self-hosted here rather than iframed from
	// vamigaweb.github.io: the Vault ships as a downloadable app with its own
	// service worker, and a third-party origin would break that the moment
	// anyone ran it offline. Three things were stripped from its index.html on
	// the way in - its analytics tag, its PWA manifest link, and its own
	// service-worker registration. That last one matters: that worker caches
	// the whole app under its scope and intercepts fetches, which is both a
	// stale-file trap (the same class of problem dos.html works around for
	// js-dos) and a straight conflict with the Vault's own pwa-sw.js.
	//
	// No Kickstart ROM ships here and none is needed for the shelf as published:
	// AROS=true selects the AROS m68k Kickstart replacement (bundled under
	// amiga/roms/, APL-licensed and redistributable, unlike Commodore's own).
	//
	// port2=true puts a joystick in port 2, where almost every Amiga game looks
	// for one. mouse=true puts an actual Amiga mouse in port 1: without it the
	// emulated machine has no mouse at all, and every title that opens on
	// "press left mouse button" - the PD-library disk intros, the strategy and
	// board-game conversions, Prince of Persia's own start screen - sits on that
	// prompt forever with no way past it. The engine handles it by asking the
	// browser for pointer lock on the first click inside the canvas, which is
	// how a real Amiga mouse has to behave; Esc gives the cursor back.
	var ENGINE = "amiga/index.html";
	var CONFIG = "#AROS=true#port2=true#mouse=true";

	// ---- bring-your-own Kickstart ------------------------------------------
	// AROS is a clean-room Kickstart *replacement*, and for anything that takes
	// the machine over from its own bootblock rather than going through the OS
	// - most 1988-1991 demos, and most cracked multi-disk releases - it is not
	// a stand-in. Those titles either drop straight to the AROS shell (the
	// bootblock isn't recognised as bootable) or hang on a black screen with
	// the drive light still ticking. Confirmed against this engine: a vanilla
	// A500 hardware profile alone does not rescue them, AROS itself is the wall.
	//
	// vAmigaWeb's player API takes a real Kickstart over kickstart_rom_url and
	// injects it into the core (fetch -> wasm_loadfile "kick.rom_file" ->
	// reset), which is also the only route by which WHDLoad (.lha) content can
	// ever work. So: drop a Kickstart into emulator/roms/ under one of the
	// names below and every title on the shelf boots on it instead of AROS.
	//
	// Nothing here ships or commits one. emulator/roms/ is gitignored - the
	// same place the disk images live - so a fresh clone, and the public site,
	// find no Kickstart and fall back to the AROS path above untouched. That
	// fallback is why this whole block is additive: with no ROM present the
	// page builds exactly the URL it always did.
	//
	// Probed in order, first hit wins. kick.rom is the catch-all; the
	// version-specific names are there so several can sit side by side.
	var KICK_NAMES = ["kick.rom", "kick13.rom", "kick12.rom", "kick20.rom", "kick31.rom"];
	// Only CDTV/CD32 need an extension ROM; optional, ignored when absent.
	var KICK_EXT_NAMES = ["kick.ext.rom", "kick31.ext.rom"];

	// ---- hardware profile ---------------------------------------------------
	// The engine's shipped default is an ECS Agnus with 2MB of fast RAM. That
	// is wrong for most of this shelf: OCS-era software from 1988-1991 regularly
	// refuses to run, or corrupts itself, with fast RAM present. A stock A500 -
	// OCS, 512KB chip + 512KB slow, no fast RAM - is the right default once a
	// real Kickstart is in play.
	//
	// The engine keeps these in localStorage on its own origin, and it is
	// self-hosted under emulator/amiga/, so that origin is this one and they
	// can be seeded before the iframe boots. Seeded only on the Kickstart path:
	// under AROS the defaults are left exactly as they are, so the PD/homebrew
	// titles already on the shelf keep the behaviour they were verified with.
	// A sentinel keeps it to a one-time seed, so the engine's own hardware UI
	// stays in charge afterwards; ?model= forces a named preset for the titles
	// that need something else (A1200_STOCK for the AGA-only ones).
	var HW_SENTINEL = "vault_amiga_model";
	var DEFAULT_MODEL = "A500_VANILLA";
	var MODELS = {
		A500_UNEXPANDED: { agnus: "OCS",     denise: "OCS", chip: "512",  slow: "0",   fast: "0", cpu: "0", clock: "0" },
		A500_VANILLA:    { agnus: "OCS",     denise: "OCS", chip: "512",  slow: "512", fast: "0", cpu: "0", clock: "0" },
		A500P_STOCK:     { agnus: "ECS_2MB", denise: "ECS", chip: "1024", slow: "0",   fast: "0", cpu: "0", clock: "0" },
		A1200_STOCK:     { agnus: "AGA",     denise: "AGA", chip: "2048", slow: "0",   fast: "0", cpu: "2", clock: "2" },
		// The engine's own shipped defaults, read off its bind_config_choice()
		// calls in js/vAmiga_ui.js. This is what every AROS-path install has
		// always run on, since nothing ever wrote these keys there. Named here
		// so a title on the AROS path can ask for it explicitly and get the
		// same machine whatever an earlier title left in localStorage.
		ENGINE_DEFAULT:  { agnus: "ECS_2MB", denise: "ECS", chip: "2048", slow: "0",   fast: "2048", cpu: "0", clock: "0" }
	};
	function applyModel(name) {
		var m = MODELS[name];
		if (!m) return;
		try {
			localStorage.setItem("OPT_AGNUS_REVISION", m.agnus);
			localStorage.setItem("OPT_DENISE_REVISION", m.denise);
			localStorage.setItem("OPT_CHIP_RAM", m.chip);
			localStorage.setItem("OPT_SLOW_RAM", m.slow);
			localStorage.setItem("OPT_FAST_RAM", m.fast);
			localStorage.setItem("OPT_CPU_REVISION", m.cpu);
			localStorage.setItem("OPT_CPU_OVERCLOCKING", m.clock);
			localStorage.setItem(HW_SENTINEL, name);
		} catch (e) { /* private mode / storage off - engine defaults stand */ }
	}
	// baseline is the machine this path is supposed to start from: the vanilla
	// A500 on the Kickstart path, the engine's own defaults on the AROS path.
	function seedHardware(baseline, seedWhenUntouched) {
		var want = params.get("model");
		try {
			var seen = localStorage.getItem(HW_SENTINEL);
			if (want && MODELS[want]) {
				if (seen !== want) applyModel(want);
			} else if (!seen) {
				// Nothing has ever been forced here. On the Kickstart path that
				// means seeding the A500 profile; on the AROS path it means
				// leaving the engine's own settings alone, exactly as every
				// AROS install has run since the shelf launched.
				if (seedWhenUntouched) applyModel(baseline);
			} else if (seen !== baseline && MODELS[seen]) {
				// A previous title asked for a different machine with ?model=
				// and the engine keeps that in localStorage on this origin, so
				// without this it would stay in force for every Amiga title
				// afterwards. Put the shelf default back. This only ever
				// undoes a forced model: once the sentinel reads this path's own
				// baseline again this branch stops firing, so the engine's own
				// hardware UI stays in charge exactly as before.
				applyModel(baseline);
			}
		} catch (e) { /* ignore */ }
	}

	// First name in `names` that answers a HEAD, or null. Probed together
	// rather than in sequence so this costs one round trip, not five.
	function firstPresent(names) {
		return Promise.all(names.map(function (n) {
			return head("roms/" + encodeURIComponent(n))
				.then(function (r) { return r.ok ? n : null; })
				.catch(function () { return null; });
		})).then(function (found) {
			for (var i = 0; i < found.length; i++) if (found[i]) return found[i];
			return null;
		});
	}
	// A title can refuse the Kickstart with ?kick=aros (gamepages.js
	// "kickstart"). Wanted by software that needs AmigaOS 2.0 or later: AROS is
	// a 3.x-level replacement and runs it, a 1.3 ROM does not, and the symptom
	// is not an error but a disk that never boots or a game that comes up mute.
	// Measured for Pengo 2 and Deluxe Pac-Man - see WORKLOG.
	function findKickstart() {
		if (params.get("kick") === "aros") return Promise.resolve(null);
		return firstPresent(KICK_NAMES).then(function (rom) {
			if (!rom) return null;
			return firstPresent(KICK_EXT_NAMES).then(function (ext) {
				return { rom: rom, ext: ext };
			});
		}).catch(function () { return null; });
	}

	// ---- finding the disk ---------------------------------------------------
	// Same three places, in the same order, as dos.html: emulator/roms/ (your
	// own dumps, gitignored and empty on a fresh clone), then
	// homebrew-downloads/ for the handful of titles the Vault ships itself,
	// then the Vault's file host.
	//
	// No ?v= cache-buster here, deliberately, and this is load-bearing: the
	// engine decides which drive a file belongs in by looking at the extension
	// on the end of the address it is given. Hang "?v=<etag>" on the end and
	// "sqrxz.adf" becomes "sqrxz.adf?v=p2026...", the extension no longer
	// matches, and instead of booting the disk it stops on its own "import as
	// disk and insert into df0:/df1:" prompt. Verified by testing both ways.
	// Unlike js-dos - which keeps its own private copy of every bundle in the
	// origin private file system, and needs the ?v= trick in dos.html to ever
	// see a changed file - this engine re-fetches the disk on each load, so
	// only the ordinary HTTP cache is in play. Swapping a file in roms/ then
	// takes effect on the next revalidation rather than instantly; a hard
	// refresh forces it.
	function head(url, mode) {
		return fetch(url, mode ? { method: "HEAD", mode: mode, cache: "no-store" }
		                       : { method: "HEAD", cache: "no-store" });
	}
	function tryHosted() {
		if (!hosted) return Promise.resolve(null);
		return head(hosted, "cors").then(function (r) {
			return r.ok ? hosted : null;
		}).catch(function () { return hosted; });
	}
	function resolveDiskUrl() {
		var base = "roms/" + encodeURIComponent(disk);
		return head(base).then(function (r) {
			if (r.ok) return base;
			if (!dlfallback) return tryHosted();
			var fb = "../homebrew-downloads/" + encodeURIComponent(dlfallback);
			return head(fb).then(function (r2) {
				return r2.ok ? fb : tryHosted();
			}).catch(function () { return tryHosted(); });
		}).catch(function () { return tryHosted(); });
	}

	function fail() {
		document.getElementById("loadingMsg").innerHTML =
			"Couldn't find <code>" + disk.replace(/[<>&]/g, "") + "</code>.<br>" +
			"Drop it into <code>emulator/roms/</code> and reload.";
	}

	Promise.all([resolveDiskUrl(), findKickstart()]).then(function (r) {
		var url = r[0], kick = r[1];
		if (!url) { fail(); return; }
		// vAmigaWeb reads the disk address from the last "#" segment of its own
		// URL, so it has to be absolute - a relative path would be resolved
		// against the engine's own folder, not this page's.
		var absolute = new URL(url, window.location.href).href;
		var src;
		if (kick) {
			// The JSON form of the player API is the only one that carries
			// kickstart_rom_url, so on this path the disk moves out of the
			// trailing "#" segment and into the object's own "url". The engine
			// decodeURIComponent()s its whole hash before parsing it, so the
			// object goes out encoded.
			seedHardware(DEFAULT_MODEL, true);
			var cfg = {
				url: absolute,
				port2: true,
				mouse: true,
				kickstart_rom_url: new URL("roms/" + encodeURIComponent(kick.rom), window.location.href).href
			};
			if (kick.ext) {
				cfg.kickstart_ext_url = new URL("roms/" + encodeURIComponent(kick.ext), window.location.href).href;
			}
			src = ENGINE + "#" + encodeURIComponent(JSON.stringify(cfg));
			document.getElementById("romText").textContent = disk + " — " + kick.rom;
		} else {
			// AROS path: either no Kickstart is installed, or this title asked
			// for AROS with ?kick=aros. Hardware is only touched if this title
			// names a ?model=, or if a previous title forced one and left it
			// behind - never on a plain AROS install, which keeps the engine's
			// own settings exactly as it always has.
			seedHardware("ENGINE_DEFAULT", false);
			src = ENGINE + CONFIG + "#" + absolute;
		}
		var frame = document.createElement("iframe");
		frame.id = "amigaFrame";
		frame.allow = "autoplay; fullscreen; gamepad";
		frame.src = src;
		frame.addEventListener("load", function () {
			var msg = document.getElementById("loadingMsg");
			if (msg && msg.parentNode) msg.parentNode.removeChild(msg);
		});
		document.getElementById("amigaWrap").appendChild(frame);
	}).catch(function (e) {
		console.error(e);
		fail();
	});
})();
</script>
</body>
</html>
